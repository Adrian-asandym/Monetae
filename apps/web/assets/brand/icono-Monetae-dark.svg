        fill="#3FD68E" stroke="#3FD68E" stroke-width="4" stroke-linejoin="round"/>
  <!-- Punta de flecha -->
  <path d="M420 72 L337 100 L396 158 Z" fill="#3FD68E" stroke="#3FD68E" stroke-width="10" stroke-linejoin="round"/>
</svg>
