<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 436" width="512" height="512" role="img" aria-label="Icono M con flecha ascendente y moneda">
  <!-- Moneda -->
  <circle cx="199" cy="125" r="62" fill="#FFD05B"/>
  <circle cx="199" cy="125" r="44" fill="#EDB93B"/>
  <!-- M con flecha: pata izquierda hueca + diagonales -->
  <path d="M112 222 V355 A31 31 0 0 1 50 355 V160 L197 300 L385 105"
        fill="none" stroke="#3FD68E" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
