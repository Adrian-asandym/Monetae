# Plain HTTP only: TLS ends at Caddy on the host (Cloudflare -> Caddy -> 127.0.0.1:8090 -> here).
# No https redirect here: it would loop behind Cloudflare/Caddy.

# Client address: trust X-Forwarded-For only from loopback/private peers (Caddy reaches this
# container through the Docker port proxy). The first public address from the right wins.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Keep the scheme Caddy saw (https); fall back to this listener's scheme for direct local access.
map $http_x_forwarded_proto $monetae_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $monetae_forwarded_proto $monetae_default_port {
    default $server_port;
    https 443;
}

# Preserve the public port in forwarded metadata as well as Host.
map $http_host $monetae_forwarded_port {
    default $monetae_default_port;
    ~:(?<monetae_host_port>[0-9]+)$ $monetae_host_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        # Keep the external host: trusted_origin compares Origin to scheme + Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $monetae_forwarded_proto;
        proxy_set_header X-Forwarded-Port $monetae_forwarded_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
