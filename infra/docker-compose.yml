name: monetae
services:
  db:
    image: postgres:16
    env_file: ../.env
    ports:
      - "127.0.0.1:${MONETAE_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MONETAE_API_PORT:-8000}:8000"
  web:
    image: nginx:1.28.0-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:${MONETAE_WEB_PORT:-8080}:80"
    volumes:
      - ../apps/web/build/web:/usr/share/nginx/html:ro
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  postgres_data:
